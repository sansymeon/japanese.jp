# Regenerate homepage / dashboard curriculum stats on every push to main.
#
# Stats live in committed JSON (kml/analytics/output/). Nothing else in the
# repo — no cron, Netlify scheduled function, or build step — regenerates them.
# This workflow is the automated regenerator: run analyze_channel_learning.py
# via scripts/pre-deploy.sh, then commit fresh outputs when they change.
#
# Loop avoidance: paths-ignore skips Action re-runs when only output/ changes.
# Do NOT put [skip ci] on the bot commit — Netlify also honors that and will
# skip deploying the regenerated JSON to the live site.

name: Pre-deploy analytics

on:
  push:
    branches: [main]
    paths-ignore:
      - "kml/analytics/output/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pre-deploy-analytics-main
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need a token that can push the regenerated JSON back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kml/analytics/requirements.txt

      - name: Install analytics dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r kml/analytics/requirements.txt

      - name: Regenerate channel-learning analytics
        run: ./scripts/pre-deploy.sh

      - name: Commit and push regenerated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kml/analytics/output/
          if git diff --staged --quiet; then
            echo "Analytics outputs unchanged — nothing to commit."
            exit 0
          fi

          # No [skip ci]: Netlify must deploy this commit so the homepage
          # picks up the new generated_at. Action loops are prevented by
          # paths-ignore on kml/analytics/output/** above.
          git commit -m "chore(analytics): regenerate channel-learning stats"
          git push
