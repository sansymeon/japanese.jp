# Manual channel-learning refresh. Pushes do not run this workflow.
#
# The generator remains ./scripts/pre-deploy.sh, which calls
# kml/analytics/scripts/analyze_channel_learning.py. Run that locally, or
# start this workflow by hand. A manual run still commits changed files
# under kml/analytics/output/ when they differ.
#
# The committed report and JSON are left as they are until someone
# regenerates them. Curriculum Coverage on the public statistics page
# reads statistics/data/project_stats.json, which this workflow does not write.

name: Pre-deploy analytics

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pre-deploy-analytics-main
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need a token that can push the regenerated JSON back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kml/analytics/requirements.txt

      - name: Install analytics dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r kml/analytics/requirements.txt

      - name: Regenerate channel-learning analytics
        run: ./scripts/pre-deploy.sh

      - name: Commit and push regenerated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kml/analytics/output/
          if git diff --staged --quiet; then
            echo "Analytics outputs unchanged — nothing to commit."
            exit 0
          fi

          # [skip netlify] keeps a later manual run from starting a production build
          # if automatic Netlify builds are turned back on. Do not use [skip ci].
          git commit -m "chore(analytics): regenerate channel-learning stats [skip netlify]"
          git push
