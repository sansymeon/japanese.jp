<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4e6">
  <meta name="robots" content="noindex">
  <meta name="description" content="Fred's Adventure is a playful demonstration. A fictional parking discount is saved on every scan, then a mystery prize. Nothing is redeemable.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Fred's Adventure</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f6b26b'/%3E%3Ccircle cx='24' cy='30' r='4' fill='%23241c16'/%3E%3Ccircle cx='40' cy='30' r='4' fill='%23241c16'/%3E%3Cpath d='M22 40q10 10 20 0' fill='none' stroke='%23241c16' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/adventure.css">
</head>
<body data-world="welcome">
  <div class="world">
    <div class="app" id="app">
      <header class="top">
        <div class="top-row">
          <button type="button" class="text-btn" id="nav-back" hidden>Back</button>
          <button type="button" class="wordmark" id="wordmark">Fred's <span>Adventure</span></button>
          <div class="top-tools">
            <button type="button" class="text-btn" id="sound-btn" aria-pressed="true">Sound</button>
            <button type="button" class="text-btn demo-link" id="demo-open">Demo</button>
          </div>
        </div>
        <button type="button" class="text-btn pass-link" id="pass-open" hidden aria-haspopup="dialog" aria-controls="pass-dialog" aria-expanded="false">My Parking Pass</button>
      </header>
      <main id="screen" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="demo-dialog" aria-labelledby="demo-title">
    <div class="demo-head">
      <div>
        <p class="kicker">Simulation only</p>
        <h2 id="demo-title">Merchant rewards</h2>
      </div>
      <button type="button" class="text-btn" id="demo-close">Close</button>
    </div>
    <div class="demo-body" id="demo-body"></div>
  </dialog>

  <dialog id="pass-dialog" aria-labelledby="pass-title">
    <div class="demo-head">
      <div>
        <p class="kicker">Saved in this browser</p>
        <h2 id="pass-title">My Parking Pass</h2>
      </div>
      <button type="button" class="text-btn" id="pass-close">Close</button>
    </div>
    <div class="demo-body" id="pass-body"></div>
  </dialog>

  <p id="live" class="sr-only" aria-live="polite"></p>
  <script src="js/qr.js"></script>
  <script src="js/adventure.js"></script>
</body>
</html>
