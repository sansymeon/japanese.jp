<section class="kanji-entry"
         id="kanji-{{SLUG}}"
         data-kanji="{{KANJI}}"
         data-slug="{{SLUG}}">

  <h2 class="kanji-header">
    <a target="_blank"
       class="stroke-link"
       href="../../../../tools/strokes/pages/{{SLUG}}.html">

      <img class="kanji-main"
           src="../../../../assets/art/kanji-art/{{SLUG}}.png"
           alt="{{KANJI}}">

      <span>{{KEYWORD}}</span>
    </a>
  </h2>

  <div class="mnemonic">
    <img src="../../../../assets/art/mnemonics/{{SLUG}}.png">
  </div>

  <div class="kml-verses">
    <p class="jp-verse">{{JP_VERSE}}</p>
    <p class="en-verse">{{EN_VERSE}}</p>
  </div>

  <div class="kanji-readings">
    On: {{ON}} ・ Kun: {{KUN}}
  </div>

  <div class="kanji-primitives">
    {{PRIMITIVES}}
  </div>

  <div class="emoji-hint">
    <img src="../../../../assets/emoji/{{SLUG}}.png">
  </div>

</section>
