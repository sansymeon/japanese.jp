<section class="kanji-entry"
         id="kanji-{{SLUG}}"
         data-kanji="{{KANJI}}"
         data-slug="{{SLUG}}">

  <h2 class="kanji-header">
    <a target="_blank"
       class="stroke-link"
       href="../../../../tools/strokes/pages/{{SLUG}}.html">

      <span class="kanji-main-font">{{KANJI}}</span>
      <span class="kanji-keyword">{{KEYWORD}}</span>

    </a>
  </h2>

  <div class="kanji-study">
    <img src="../../../../assets/studies/{{SLUG}}.png"
         alt="Kanji study for {{KANJI}}"
         loading="lazy"
         onerror="this.style.display='none'">
  </div>

  <div class="kml-verses">
    <p class="jp-verse">{{JP_VERSE}}</p>
    <p class="en-verse">{{EN_VERSE}}</p>
  </div>

  <div class="kanji-readings">
    On: {{ON}} ・ Kun: {{KUN}}
  </div>

  <div class="kanji-components">
    {{COMPONENTS}}
</div>

</section>
