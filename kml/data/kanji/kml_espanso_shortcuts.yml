# KML Espanso shortcuts — PASS 5 (typing acceleration only)
# Paste into your Espanso config; merge manually — do not overwrite wholesale.
# Source: primitive_dictionary.csv + kanji_master_with_components.v4.csv

matches:

# --- layout codes ---
  - trigger: ":a"
    replace: a
  - trigger: ":h"
    replace: h
  - trigger: ":v"
    replace: v
  - trigger: ":2l"
    replace: 2l
  - trigger: ":2r"
    replace: 2r
  - trigger: ":2t"
    replace: 2t
  - trigger: ":2b"
    replace: 2b
  - trigger: ":e"
    replace: e
  - trigger: ":ei"
    replace: ei

# --- CSV / editing workflow ---
  - trigger: ":pipe"
    replace: "|||"
  - trigger: ":csvh"
    replace: "|||,,,h,,"
  - trigger: ":csva"
    replace: "|||,,,a,,"
  - trigger: ":csvv"
    replace: "|||,,,v,,"

# --- structure tokens ---
  - trigger: ":bar"
    replace: "|"

