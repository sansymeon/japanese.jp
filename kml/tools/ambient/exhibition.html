<script>
  (function () {
    const p = new URLSearchParams(location.search);
    const typo = p.get("typography");
    if (typo === "legacy") document.documentElement.classList.add("kml-typography-legacy");
    if (typo === "mobile") document.documentElement.classList.add("kml-typography-mobile");
    if (typo === "mobile-refine") document.documentElement.classList.add("kml-typography-mobile-refine");
    if (p.get("verseMode") === "sequential") {
      document.documentElement.classList.add("kml-verse-sequential");
    }
    if (p.get("verseMode") === "staggered") {
      document.documentElement.classList.add("kml-verse-staggered");
    }
    // Prototype editions — inert unless the params are present.
    if (p.get("edition") === "mobile") {
      document.documentElement.classList.add("kml-edition-mobile");
    }
    const lab = (p.get("typeLab") || "").trim().toLowerCase();
    if (lab === "a" || lab === "b" || lab === "c") {
      document.documentElement.classList.add("kml-lab", "kml-typelab-" + lab);
    }
    const glow = (p.get("glowLab") || "").trim().toLowerCase();
    if (glow === "current" || glow === "reduced" || glow === "none" || glow === "tight") {
      document.documentElement.classList.add("kml-glowlab", "kml-glowlab-" + glow);
    }
    if (p.get("recordPipeline") === "1") {
      document.documentElement.classList.add("kml-record-pipeline");
    }
  })();
</script>
