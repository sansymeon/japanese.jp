<script>
  (function () {
    const p = new URLSearchParams(location.search);
    const typo = p.get("typography");
    if (typo === "legacy") document.documentElement.classList.add("kml-typography-legacy");
    if (typo === "mobile") document.documentElement.classList.add("kml-typography-mobile");
    if (typo === "mobile-refine") document.documentElement.classList.add("kml-typography-mobile-refine");
    if (p.get("verseMode") === "sequential") {
      document.documentElement.classList.add("kml-verse-sequential");
    }
    if (p.get("verseMode") === "staggered") {
      document.documentElement.classList.add("kml-verse-staggered");
    }
  })();
</script>

<!--
  Digital Art Exhibition – Lesson 40 test gallery

  Heart v5:   ?collection=heart_v5  (default)
  Heart QA (2-scene handoff loop): ?collection=heart_v5_transition_prototype&skipBookends=1
  Heart v3:   ?collection=heart_v3
  Heart v4:   ?collection=heart_v4  (fixed kanji)
  Heart v5:   ?collection=heart_v5  (gold foil bookends + soundtrack)
  Audio:      audio/flute_intro.mp3, audio/ambient_kanji_exhibition.mp3 in ambient folder
  Debug:      add &debug=1 to log bookend diagnostics and msUntilVerses
  Single exhibit (full pipeline, exhibit 0 only — verses begin ~41s; not a preview mode):
              ?collection=heart_v5&skipBookends=1&exhibit=0&singleExhibit=1
  Faster full pipeline (5% timing): add &timingScale=0.05  (~2s preamble, ~1.5s before EN)
  PARTY KANJI v1 (Episode 1 — 龘):
              ?collection=party_kanji_v1&skipBookends=1&singleExhibit=1
  Flow: Shock → Reveal → Proof → Final pulse → Closing → End card
  Stroke Order L1 (calligraphy studio — 一):
              ?collection=lesson_01_strokes&exhibit=0&singleExhibit=1
  Compounds L1 (一 → 一日):
              ?collection=lesson_01_compounds&exhibit=0&singleExhibit=1
  Grade 1 Compounds school prototype (学 → 学校, stacked):
              ?collection=grade_1_compounds_school&skipBookends=1
  Prototype hub: grade-1-compounds-prototype.html
  Stroke QA:  add &timingScale=0.05
  Record:     python3 scripts/record_party_kanji.py
  Verse typography QA (skips title phases; still runs verse + essence + exit):
              ?collection=heart_v5&skipBookends=1&exhibit=0&singleExhibit=1&startPhase=reflection
  Scene tests (add &timingScale=0.05 for speed):
              愛 love      exhibit=0
              忘 forget     exhibit=1
              怒 angry      exhibit=41  (sunset)
              怪 suspicious exhibit=42  (noir / moonlight)
  Typography: mobile-refine (default in heart_v5); Cormorant keyword + EN verse
  Keyboard (hidden): Space pause · → next · ← previous

  No on-screen controls. Museum projection only.
-->

<div class="exhibition-root" data-exhibition-root>

  <div class="exhibition-loading" data-exhibition-loading aria-hidden="true"></div>
  <div class="exhibition-error exhibition-hidden" data-exhibition-error></div>

  <div class="exhibition-artwork" data-exhibition-artwork="a" aria-hidden="true">
    <img data-exhibition-artwork-img="a" alt="">
  </div>

  <div class="exhibition-artwork" data-exhibition-artwork="b" aria-hidden="true">
    <img data-exhibition-artwork-img="b" alt="">
  </div>

  <div class="exhibition-bookend" data-exhibition-bookend aria-hidden="true">
    <div class="exhibition-bookend-composition" data-exhibition-bookend-composition>
      <img data-exhibition-bookend-img alt="">
      <img class="exhibition-bookend-stamp exhibition-hidden" data-exhibition-bookend-stamp alt="">
      <div class="exhibition-bookend-title exhibition-hidden" data-exhibition-bookend-title aria-hidden="true"></div>
    </div>
  </div>

  <div class="exhibition-vignette" aria-hidden="true"></div>

  <div class="exhibition-title kml-title-block">
    <div class="exhibition-kanji" data-exhibition-kanji></div>
    <div class="exhibition-keyword" data-exhibition-keyword></div>
  </div>

  <div class="exhibition-notes kml-verse-block">
    <p class="exhibition-verse-jp" data-exhibition-verse-jp></p>
    <p class="exhibition-verse-en" data-exhibition-verse-en></p>
  </div>

  <div class="exhibition-veil" data-exhibition-veil aria-hidden="true"></div>

  <div class="anchor-compounds-layer exhibition-hidden" data-anchor-compounds-layer aria-hidden="true">
    <div class="anchor-compounds-stage" data-anchor-compounds-stage>
      <div class="anchor-compounds-focus" data-anchor-compounds-focus>
        <div class="anchor-compounds-word" data-anchor-compounds-word lang="ja"></div>
        <div class="anchor-compounds-reading" data-anchor-compounds-reading lang="ja"></div>
      </div>
    </div>
  </div>

  <div class="stroke-order-layer exhibition-hidden" data-stroke-order-layer aria-hidden="true">
    <div class="stroke-order-stage" data-stroke-order-stage>
      <div class="soundtrack-slot" data-soundtrack-slot="a">
        <div class="stroke-order-kanji kanji-main-font" data-stroke-order-kanji="a" lang="ja"></div>
        <div class="stroke-order-svg" data-stroke-order-svg="a" aria-hidden="true"></div>
      </div>
      <div class="soundtrack-slot" data-soundtrack-slot="b">
        <div class="stroke-order-kanji kanji-main-font" data-stroke-order-kanji="b" lang="ja"></div>
        <div class="stroke-order-svg" data-stroke-order-svg="b" aria-hidden="true"></div>
      </div>
      <div class="grade1-confetti-layer exhibition-hidden" data-grade1-confetti-layer aria-hidden="true"></div>
    </div>
  </div>

  <div class="g4-layer exhibition-hidden" data-g4-layer aria-hidden="true">
    <div class="g4-washi-bg" aria-hidden="true"></div>
    <div class="g4-vignette" aria-hidden="true"></div>
    <div class="g4-stage">
      <div class="g4-board-viewport">
        <div class="g4-board-camera is-overview" data-g4-camera>
          <div class="g4-board">
            <div class="g4-board-inner" data-g4-board></div>
          </div>
        </div>
      </div>
    </div>
    <div class="g4-kanji-hero exhibition-hidden" data-g4-kanji-hero>
      <div class="g4-kanji-hero-stage">
        <div class="soundtrack-slot" data-g4-slot="a">
          <span class="g4-kanji-hero-char" data-g4-kanji="a" lang="ja"></span>
        </div>
        <div class="soundtrack-slot" data-g4-slot="b">
          <span class="g4-kanji-hero-char" data-g4-kanji="b" lang="ja"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="party-kanji-layer exhibition-hidden" data-party-kanji-layer aria-hidden="true">
    <div class="party-kanji-phase party-kanji-shock" data-party-phase="shock">
      <div class="party-kanji-giant party-kanji-giant--enter" data-party-shock-kanji></div>
      <div class="party-kanji-challenge party-kanji-challenge--hidden" data-party-challenge></div>
    </div>
    <div class="party-kanji-phase party-kanji-reveal" data-party-phase="reveal">
      <div class="party-kanji-playlist" data-party-playlist></div>
      <div class="party-kanji-components party-kanji-components--burst" data-party-components></div>
      <div class="party-kanji-equation party-kanji-equation--hidden" data-party-equation></div>
      <div class="party-kanji-reading" data-party-reading></div>
      <div class="party-kanji-trivia" data-party-trivia></div>
    </div>
    <div class="party-kanji-phase party-kanji-proof" data-party-phase="proof">
      <div class="party-kanji-strokes-wrap">
        <iframe data-party-strokes-frame title="Stroke order" loading="lazy"></iframe>
      </div>
      <div class="party-kanji-stroke-note" data-party-stroke-note></div>
    </div>
    <div class="party-kanji-phase party-kanji-final" data-party-phase="final">
      <div class="party-kanji-final-wrap">
        <div class="party-kanji-component-pulse" data-party-component-pulse aria-hidden="true"></div>
        <div class="party-kanji-giant party-kanji-giant--reward" data-party-final-kanji></div>
      </div>
      <div class="party-kanji-reading" data-party-final-reading></div>
    </div>
    <div class="party-kanji-phase party-kanji-closing" data-party-phase="closing">
      <p class="party-kanji-closing-message" data-party-closing-message></p>
    </div>
    <div class="party-kanji-phase party-kanji-endcard" data-party-phase="endcard">
      <div class="party-kanji-brand" data-party-brand>PARTY KANJI</div>
      <div class="party-kanji-playlist-end" data-party-playlist-end></div>
      <div class="party-kanji-tagline" data-party-tagline></div>
      <div class="party-kanji-disclaimer" data-party-disclaimer></div>
    </div>
  </div>

  <button
    type="button"
    class="exhibition-autoplay-gate exhibition-hidden"
    data-exhibition-autoplay-gate
    aria-label="Tap or click to begin the exhibition"
  >
    Tap or click to begin the exhibition
  </button>

  <div class="exhibition-audio" aria-hidden="true">
    <audio data-exhibition-intro-audio preload="auto"></audio>
    <audio data-exhibition-ambient-audio preload="auto"></audio>
  </div>

</div>
