<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KML Digital Art Exhibition</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Yuji+Syuku&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/gallery-typography.css?v=2">
  <link rel="stylesheet" href="./css/gallery-mobile-verses.css?v=3">
  <link rel="stylesheet" href="./css/gallery-mobile-refine.css">
  <link rel="stylesheet" href="./css/exhibition.css">
</head>
<body>

<script>
  (function () {
    const p = new URLSearchParams(location.search);
    const typo = p.get("typography");
    if (typo === "legacy") document.documentElement.classList.add("kml-typography-legacy");
    if (typo === "mobile") document.documentElement.classList.add("kml-typography-mobile");
    if (typo === "mobile-refine") document.documentElement.classList.add("kml-typography-mobile-refine");
    if (p.get("verseMode") === "sequential") {
      document.documentElement.classList.add("kml-verse-sequential");
    }
  })();
</script>

<!--
  Digital Art Exhibition – Lesson 40 test gallery

  Heart v5:   ?collection=heart_v5  (default)
  Heart v3:   ?collection=heart_v3
  Heart v4:   ?collection=heart_v4  (fixed kanji)
  Heart v5:   ?collection=heart_v5  (gold foil bookends + soundtrack)
  Audio:      audio/flute_intro.mp3, audio/ambient_kanji_exhibition.mp3 in ambient folder
  Debug:      add &debug=1 to log bookend diagnostics
  Mobile refine test: ?collection=heart_v5&skipBookends=1&exhibit=0&singleExhibit=1&verseMode=sequential&typography=mobile-refine
  Mobile test: ?collection=heart_v5&skipBookends=1&exhibit=0&singleExhibit=1&verseMode=sequential&typography=mobile
  Keyboard (hidden): Space pause · → next · ← previous

  No on-screen controls. Museum projection only.
-->

<div class="exhibition-root" data-exhibition-root>

  <div class="exhibition-loading" data-exhibition-loading aria-hidden="true"></div>
  <div class="exhibition-error exhibition-hidden" data-exhibition-error></div>

  <div class="exhibition-artwork" data-exhibition-artwork aria-hidden="true">
    <img data-exhibition-artwork-img alt="">
  </div>

  <div class="exhibition-bookend" data-exhibition-bookend aria-hidden="true">
    <img data-exhibition-bookend-img alt="">
  </div>

  <div class="exhibition-vignette" aria-hidden="true"></div>

  <div class="exhibition-title kml-title-block">
    <div class="exhibition-kanji" data-exhibition-kanji></div>
    <div class="exhibition-keyword" data-exhibition-keyword></div>
  </div>

  <div class="exhibition-notes kml-verse-block">
    <p class="exhibition-verse-jp" data-exhibition-verse-jp></p>
    <p class="exhibition-verse-en" data-exhibition-verse-en></p>
  </div>

  <div class="exhibition-veil" data-exhibition-veil aria-hidden="true"></div>

  <button
    type="button"
    class="exhibition-autoplay-gate exhibition-hidden"
    data-exhibition-autoplay-gate
    aria-label="Tap or click to begin the exhibition"
  >
    Tap or click to begin the exhibition
  </button>

  <div class="exhibition-audio" aria-hidden="true" hidden>
    <audio data-exhibition-intro-audio preload="auto"></audio>
    <audio data-exhibition-ambient-audio preload="auto"></audio>
  </div>

</div>

<script src="./js/gallery-guardian.js?v=2"></script>
<script src="./js/exhibition-engine.js?v=16"></script>
</body>
</html>
