<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KML Ambient Player</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&family=Yuji+Syuku&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/gallery-typography.css?v=5">
  <link rel="stylesheet" href="./css/gallery-mobile-study-v2.css">
  <link rel="stylesheet" href="./css/gallery-mobile-refine.css?v=17">
  <link rel="stylesheet" href="./css/gallery-foundations.css?v=1">
  <link rel="stylesheet" href="./css/ambient.css">
</head>
<body>

<script>
  (function () {
    const typo = new URLSearchParams(location.search).get("typography");
    if (typo === "legacy") document.documentElement.classList.add("kml-typography-legacy");
    if (typo === "mobile") document.documentElement.classList.add("kml-typography-mobile");
    if (typo === "mobile-v2") document.documentElement.classList.add("kml-typography-mobile-v2");
    if (typo === "mobile-refine") document.documentElement.classList.add("kml-typography-mobile-refine");
  })();
</script>

<!--
  KML Ambient Player

  Collections (YouTube / loop — collections/; lessons 1–10 under collections/lesson_XX/):
    ?collection=lesson_38_foundations
    ?collection=lesson_39_foundations
    ?collection=lesson_40_foundations
    ?collection=lesson_41_foundations
    ?collection=heart_v2

  Exhibition / presentation (Gallery Seal Ending — exhibition/):
    ?collection=lesson_37_foundations&capture=1
    ?collection=lesson_38_foundations&capture=1
    ?collection=lesson_39_foundations&capture=1
    ?collection=lesson_40_foundations&capture=1

  Archived (50 min Lesson 40 ambient/exhibition): collections/archive/

  OBS / presentation mode (no chrome, no loop, clean ending):
    ?collection=lesson_40_foundations&capture=1

  Flow: intro → cards → Gallery Seal Ending. With capture=1, loads exhibition/ build automatically.

  Record Study Exhibition MP4s:
    ./scripts/record_foundations_exhibition.sh
    → foundations_exhibitions/lesson_XX_foundations.mp4

  Lesson 1 mobile readability refine (test):
    ?collection=lesson_1_foundations&capture=1&typography=mobile-refine

  Lesson 1 mobile layout V2 (previous):
    ?collection=lesson_1_foundations&capture=1&typography=mobile-v2
    ./scripts/record_lesson_01_mobile_test_v2.py
    → foundations_exhibitions/lesson_01_foundations_mobile_test_v2.mp4

  Serve from this directory (assets symlink required):
    ./serve.sh

  The player resolves ../../assets → /assets/... in the browser.
  studies live at kml/assets/studies/ — exposed via ./assets → ../../assets
-->

<div class="ambient-root" data-ambient-root>

  <div class="ambient-loading" data-ambient-loading>Loading collection…</div>
  <div class="ambient-error ambient-hidden" data-ambient-error></div>

  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-bg-layer" data-ambient-bg="0"></div>
    <div class="ambient-bg-layer" data-ambient-bg="1"></div>
    <div class="ambient-overlay" data-ambient-overlay></div>
  </div>

  <div class="ambient-stage">
    <div class="ambient-kanji-block kml-title-block" data-ambient-kanji-block>
      <div class="ambient-kanji" data-ambient-kanji></div>
      <div class="ambient-keyword" data-ambient-keyword></div>
    </div>

    <div class="ambient-image-wrap" data-ambient-image-wrap>
      <img data-ambient-image alt="">
    </div>

    <div class="ambient-verses kml-verse-block" data-ambient-verses>
      <p class="ambient-verse-jp" data-ambient-verse-jp></p>
      <p class="ambient-verse-en" data-ambient-verse-en></p>
    </div>
  </div>

  <div class="ambient-chrome">
    <div class="ambient-title" data-ambient-title>KML Ambient</div>
    <div class="ambient-status" data-ambient-status></div>
    <div class="ambient-controls">
      <button type="button" data-ambient-prev>Previous</button>
      <button type="button" data-ambient-toggle>Pause motion</button>
      <button type="button" data-ambient-next>Next</button>
      <button type="button" data-ambient-furigana>Furigana</button>
    </div>
    <div class="ambient-progress" data-ambient-progress></div>
  </div>

  <button
    type="button"
    class="ambient-autoplay-gate ambient-hidden"
    data-ambient-autoplay-gate
    aria-label="Tap or click to begin"
  >
    Tap or click to begin
  </button>

  <div class="ambient-audio" aria-hidden="true">
    <audio data-ambient-intro-audio preload="auto"></audio>
    <audio data-ambient-lesson-audio preload="auto"></audio>
  </div>

</div>

<script src="./js/collection-paths.js?v=1"></script>
<script src="./js/verse-display.js?v=1"></script>
<script src="./js/ambient-engine.js?v=study31"></script>
</body>
</html>
