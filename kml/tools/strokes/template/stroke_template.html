<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/kml/">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Different Strokes – {{SLUG}}</title>

  <!-- Yomogi font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="tools/strokes/css/strokes.css" />
</head>

<body>

<!-- Washi Background -->
<div id="washi-bg"></div>
<div id="washi-messy"></div>

<!-- Intro -->
<div id="intro" class="intro">

  <div class="intro-highlight">
    <img src="assets/art/kanji-art/{{SLUG}}.png" alt="{{KANJI}}">
  </div>

  <div class="intro-sub">{{READING}} "{{KEYWORD}}"</div>

  <p><strong>Welcome to Different Strokes:<br>
  A unique way of learning Kanji stroke orders</strong></p>

  <p>While watching, trace the character on your palm.</p>

</div>

<!-- MAIN PAGE -->
<div class="page">

  <!-- STAGE -->
  <div class="kanji-stage">

    <!-- STROKES -->
    <div class="stroke-order">
      {{SVG_INLINE}}
    </div>

  </div> <!-- END .kanji-stage -->

  <!-- FINAL (KANJI + STAMP) -->
  <div id="emoji-block" class="emoji-block">

    <div class="emoji-kanji-wrap">

      <img class="final-kanji"
           src="assets/art/kanji-art/{{SLUG}}.png"
           alt="{{KANJI}}">

      <img class="stamp"
           src="assets/site/stamps/symeon_stamp.png"
           alt="stamp">

    </div>

    <div class="emoji-keyword">{{KEYWORD}}</div>
    <div class="attribution">Brought to you by SanSymeon &amp; ChatGPT</div>
    <div class="signature">Drawn by One. Remembered by Many.</div>

  </div>

</div> <!-- END .page -->

<!-- CLOSING -->
<div id="closing" class="closing">

  <img src="assets/site/illustrations/castle.png"
       class="closing-art"
       loading="lazy"
       decoding="async" />

  <div class="closing-buttons">

    <button class="btn" id="loop-btn">🔁 Repeat</button>

    <a class="btn next-btn"
       href="tools/strokes/pages/{{NEXT_LINK}}">
       ➡️ Next
    </a>

  </div>

</div>

<script src="tools/strokes/js/strokes_sequence.js" defer></script>

</body>
</html>
