<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Different Strokes – {{SLUG}}</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP&family=Yomogi&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="../../strokes/css/strokes.css" />
</head>

<body>

<!-- Washi Background -->
<div id="washi-bg"></div>
<div id="washi-messy"></div>

<!-- INTRO -->
<div id="intro" class="intro">

  <div class="intro-sub">{{READING}} "{{KEYWORD}}"</div>

  <p><strong>Welcome to Different Strokes:<br>
  A unique way of learning Kanji stroke orders</strong></p>

  <p>While watching, trace the character on your palm.</p>

</div>

<!-- MAIN PAGE -->
<div class="page">

  <!-- STAGE -->
  <div class="kanji-stage">

    <!-- FONT KANJI DISPLAY -->
    <div class="kanji-display">
      <span class="kanji-main-font">{{KANJI}}</span>
    </div>

    <!-- STROKE SVG (ONLY ONE — IMPORTANT) -->
    <div class="stroke-order">
      {{SVG_INLINE}}
    </div>

  </div> <!-- END .kanji-stage -->

  <!-- FINAL (KANJI + STAMP) -->
  <div id="emoji-block" class="emoji-block">

    <div class="emoji-kanji-wrap">

      <!-- FINAL KANJI (FONT-BASED) -->
      <div class="final-kanji kanji-main-font">
        {{KANJI}}
      </div>

      <!-- STAMP -->
      <img class="stamp"
           src="../../../assets/site/stamps/symeon_stamp.png"
           alt="stamp">

    </div>

    <div class="emoji-keyword">{{KEYWORD}}</div>
    <div class="attribution">Brought to you by SanSymeon &amp; ChatGPT</div>
    <div class="signature">Drawn by One. Remembered by Many.</div>

  </div>

</div> <!-- END .page -->

<!-- CLOSING -->
<div id="closing" class="closing">

  <img src="../../../assets/site/illustrations/castle.png"
       class="closing-art"
       loading="lazy"
       decoding="async" />

  <div class="closing-buttons">

  <button class="btn" id="loop-btn">🔁 Repeat</button>

  <a class="btn" id="back-btn" href="#">
    ⬅️ Back
  </a>

  <a class="btn next-btn"
     href="{{NEXT_LINK}}">
    ➡️ Next
  </a>

</div>

</div>

<!-- SCRIPT -->
<script src="../../strokes/js/strokes_sequence.js" defer></script>
<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const from = params.get("from");

  const backBtn = document.getElementById("back-btn");

  if (from) {
    backBtn.href = "../../contents/books/book_01/lessons/" + from;
  } else {
    backBtn.style.display = "none";
  }
})();
</script>
<script>
(function() {
  const nextBtn = document.querySelector(".next-btn");
  const href = nextBtn.getAttribute("href");

  if (!href || href === "None") {
    nextBtn.style.display = "none";
  }
})();
</script>
</body>
</html>
