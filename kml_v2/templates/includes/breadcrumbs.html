<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol>
    {% for crumb in breadcrumbs %}
      {% if crumb.current %}
        <li><span aria-current="page">{{ crumb.label }}</span></li>
      {% else %}
        <li><a href="{{ crumb.href }}">{{ crumb.label }}</a></li>
      {% endif %}
    {% endfor %}
  </ol>
</nav>
